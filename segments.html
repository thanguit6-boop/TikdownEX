<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chia đoạn</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#12121a;
    color:#fff;
    font:500 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    user-select:none;
    -webkit-user-select:none;
  }
  body{
    overflow-x:hidden;
    overflow-y:auto;
    scrollbar-width:thin;
  }
  #grid{
    display:grid;
    justify-content:center;
    align-content:start;
    gap:6px;
    padding:8px;
    grid-template-columns:repeat(3,100px);
    --ar:.5625;
  }
  .cell{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:var(--ar);
    min-width:0;
    border:1px solid rgba(255,255,255,.14);
    border-radius:6px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
    cursor:pointer;
  }
  .cell:hover{
    border-color:rgba(255,255,255,.45);
  }
  .cell.is-active{
    border-color:rgba(34,211,238,.9);
    box-shadow:0 0 0 1px rgba(34,211,238,.6);
  }
  .img{
    display:none;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cell.has-frame .img{display:block;}
  .no{
    position:absolute;
    left:2px;
    top:2px;
    z-index:1;
    min-width:14px;
    padding:2px 3px;
    border-radius:4px;
    background:rgba(0,0,0,.62);
    font-size:10px;
    font-weight:700;
    line-height:1;
    text-align:center;
  }
  .at{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:1;
    padding:10px 2px 3px;
    background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78));
    font-size:10px;
    line-height:1;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
  <div id="grid" role="group" aria-label="Chia đoạn video"></div>
  <script src="segments.js"></script>
</body>
</html>
